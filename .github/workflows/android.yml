name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Firebase Functions
        working-directory: firebase/functions
        run: |
          npm install --ignore-scripts
          npm run lint

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare production signing
        env:
          FAMYREX_KEYSTORE_BASE64: ${{ secrets.FAMYREX_KEYSTORE_BASE64 }}
          FAMYREX_KEYSTORE_PASSWORD: ${{ secrets.FAMYREX_KEYSTORE_PASSWORD }}
          FAMYREX_KEY_ALIAS: ${{ secrets.FAMYREX_KEY_ALIAS }}
          FAMYREX_KEY_PASSWORD: ${{ secrets.FAMYREX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in FAMYREX_KEYSTORE_BASE64 FAMYREX_KEYSTORE_PASSWORD FAMYREX_KEY_ALIAS FAMYREX_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$FAMYREX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/famyrex-release.jks"
          test -s "$RUNNER_TEMP/famyrex-release.jks"

      - name: Run unit tests
        env:
          FAMYREX_KEYSTORE_PASSWORD: ${{ secrets.FAMYREX_KEYSTORE_PASSWORD }}
          FAMYREX_KEY_ALIAS: ${{ secrets.FAMYREX_KEY_ALIAS }}
          FAMYREX_KEY_PASSWORD: ${{ secrets.FAMYREX_KEY_PASSWORD }}
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Assemble release APK
        env:
          FAMYREX_KEYSTORE_PATH: ${{ runner.temp }}/famyrex-release.jks
          FAMYREX_KEYSTORE_PASSWORD: ${{ secrets.FAMYREX_KEYSTORE_PASSWORD }}
          FAMYREX_KEY_ALIAS: ${{ secrets.FAMYREX_KEY_ALIAS }}
          FAMYREX_KEY_PASSWORD: ${{ secrets.FAMYREX_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Assemble release bundle
        env:
          FAMYREX_KEYSTORE_PATH: ${{ runner.temp }}/famyrex-release.jks
          FAMYREX_KEYSTORE_PASSWORD: ${{ secrets.FAMYREX_KEYSTORE_PASSWORD }}
          FAMYREX_KEY_ALIAS: ${{ secrets.FAMYREX_KEY_ALIAS }}
          FAMYREX_KEY_PASSWORD: ${{ secrets.FAMYREX_KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Verify production APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "${ANDROID_HOME:?}"/build-tools -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Verify production bundle signature
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          jarsigner -verify -strict "$AAB"

      - name: Normalize release outputs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk famyrex-release.apk
          cp app/build/outputs/bundle/release/app-release.aab famyrex-release.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: famyrex-debug-apk
          path: app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: famyrex-release-apk
          path: famyrex-release.apk
          if-no-files-found: error

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: famyrex-release-aab
          path: famyrex-release.aab
          if-no-files-found: error
