name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare production signing
        if: ${{ secrets.FAMYREX_KEYSTORE_BASE64 != '' }}
        env:
          FAMYREX_KEYSTORE_BASE64: ${{ secrets.FAMYREX_KEYSTORE_BASE64 }}
        run: |
          echo "$FAMYREX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/famyrex-release.jks"
          test -s "$RUNNER_TEMP/famyrex-release.jks"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Assemble release APK
        env:
          FAMYREX_KEYSTORE_PATH: ${{ runner.temp }}/famyrex-release.jks
          FAMYREX_KEYSTORE_PASSWORD: ${{ secrets.FAMYREX_KEYSTORE_PASSWORD }}
          FAMYREX_KEY_ALIAS: ${{ secrets.FAMYREX_KEY_ALIAS }}
          FAMYREX_KEY_PASSWORD: ${{ secrets.FAMYREX_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Assemble release bundle
        env:
          FAMYREX_KEYSTORE_PATH: ${{ runner.temp }}/famyrex-release.jks
          FAMYREX_KEYSTORE_PASSWORD: ${{ secrets.FAMYREX_KEYSTORE_PASSWORD }}
          FAMYREX_KEY_ALIAS: ${{ secrets.FAMYREX_KEY_ALIAS }}
          FAMYREX_KEY_PASSWORD: ${{ secrets.FAMYREX_KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: famyrex-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: famyrex-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: famyrex-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
